server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩。文本类资源 gzip 通常能压到 1/3，首屏体感差别明显。
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    # SPA 路由兜底：直接访问 /knowledge 或刷新页面时，磁盘上并没有这个路径，
    # 不回落就会 404。前端路由是靠 index.html 里的 JS 接管的。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # /api/ 反代到网关
    #
    # ⚠️ 这里不用 upstream 块，而是用变量 + resolver —— 这是个必须绕开的坑：
    # nginx 在**启动时**解析写死的 upstream 主机名。compose 起来时 gateway
    # 容器可能还没就绪（甚至还没创建），nginx 会以
    # `host not found in upstream "gateway"` 直接退出，且 restart: unless-stopped
    # 会让它反复重启刷一片日志，看起来像「网关挂了」。
    # 改成变量后，解析推迟到**请求发生时**；resolver 指向 Docker 内嵌 DNS
    # （127.0.0.11），容器网络里固定可用。
    # ------------------------------------------------------------------
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $gateway_upstream "http://gateway:3000";
        proxy_pass $gateway_upstream;

        proxy_http_version 1.1;
        # chunked 传输需要 HTTP/1.1；nginx 对 upstream 默认用 1.0。
        # 同时清掉 Connection 头，避免把浏览器的 keep-alive 语义透传给上游。
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ NDJSON 流式的命门。nginx 默认开响应缓冲：后端逐字吐出来的 token
        # 会被攒在 nginx 的缓冲区里，前端就变成「转圈十几秒然后一次性糊出来」。
        # 这一行不对，前面做的流式等于白做 —— 而且它不会报错，只是慢。
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # 一次问答（检索 + 重排 + 大模型生成）正常要几十秒，
        # nginx 默认 60s 读超时会在长回答上掐断连接。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 前端同源访问，浏览器不会发跨域 Origin，所以网关的 CORS 白名单不介入。
    # 若将来把前端独立部署到别的域名，需要同步改 GATEWAY_ALLOWED_ORIGINS。
}
